<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#f5f7fb">
    <title>TODOリスト</title>
    <link rel="stylesheet" href="styles.css">
    <script type="module" src="app.mjs"></script>
  </head>
  <body>
    <main class="todo-app">
      <header class="page-header">
        <p class="eyebrow">MY DAY</p>
        <h1>TODOリスト</h1>
        <p class="subtitle">やることを整理して、ひとつずつ進めましょう。</p>
      </header>

      <form class="todo-form" id="todo-form">
        <label class="visually-hidden" for="todo-input">新しいTODO</label>
        <input
          id="todo-input"
          name="todo"
          type="text"
          placeholder="新しいTODOを入力"
          maxlength="200"
          autocomplete="off"
          required
        >
        <button class="add-button" type="submit">追加</button>
      </form>

      <section class="list-card" aria-labelledby="list-heading">
        <div class="list-header">
          <h2 id="list-heading">今日のTODO</h2>
          <span class="todo-count" id="todo-count" aria-live="polite"></span>
        </div>
        <ul class="todo-list" id="todo-list"></ul>
        <p class="empty-state" id="empty-state">TODOはまだありません。上から追加できます。</p>
      </section>
    </main>
  </body>
</html>
